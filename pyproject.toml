[project]
name = "annotate-tool"
version = "0.1.0"
description = "COCO instance-segmentation viewer / annotation tool"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.1",
    "opencv-python-headless>=5.0.0.93",
    "pyside6>=6.11.1",
]

[project.scripts]
annotate-tool = "annotate_tool.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/annotate_tool"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
